name: Check TikTok Live

on:
  workflow_dispatch: {}   # ให้ cron-job.org (หรือกดมือ) เป็นตัวสั่งรันเท่านั้น

concurrency:
  group: tiktok-live-check
  cancel-in-progress: false   # ถ้ามีรอบใหม่เข้ามาตอนรอบเก่ายังไม่จบ ให้รอคิวแทนรันซ้อน

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tiktok_live_notifier.py

      - name: Commit state if changed
        run: |
          git config user.name "tiktok-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "update live state"
            git push
          fi
