name: Check TikTok Live

on:
  workflow_dispatch: {}   # ให้ cron-job.org (หรือกดมือ) เป็นตัวสั่งรันเท่านั้น

concurrency:
  group: tiktok-live-check
  cancel-in-progress: false   # ถ้ามีรอบใหม่เข้ามาตอนรอบเก่ายังไม่จบ ให้รอคิวแทนรันซ้อน

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tiktok_live_notifier.py

      - name: Commit state if changed
        run: |
          git config user.name "tiktok-live-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi

          git add state.json
          git commit -m "update live state"

          attempt=1
          while [ $attempt -le 5 ]; do
            if git push; then
              echo "push สำเร็จ"
              exit 0
            fi
            echo "push ไม่สำเร็จ ลอง rebase แล้วลองใหม่ (ครั้งที่ $attempt)"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt+1))
            sleep $((RANDOM % 5 + 1))
          done
          echo "push ไม่สำเร็จหลังลองหลายครั้ง"
          exit 1
